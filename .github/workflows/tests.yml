name: Tests

# Fast guard checks on every push/PR. Intentionally dependency-light: the
# call_with_thinking signature guard is stdlib-only (ast), so it runs without
# installing the project or any secrets/network. This is what turns a silent
# prod break (like the 2026-06-21 call_with_thinking overload drift that took
# the daily pipeline RED) into a red check before it can merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-contracts:
    name: Release contract guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Public schema, MCP, container, and release contracts
        run: |
          python3 -m unittest \
            tests.mcp_report_store_test \
            tests.container_configuration_test \
            tests.release_readiness_test -v

  guard:
    name: Signature lockstep guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            agents
            api
            assets
            config
            docs
            frontend
            generators
            pipeline_support
            requirements
            scripts
            templates
            tests
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: call_with_thinking signature lockstep
        run: python3 -m unittest tests.call_with_thinking_signature_test -v
      - name: Topic-detection JSON extraction survives fences/preambles (2026-07-09)
        run: python3 -m unittest tests.extract_json_str_test -v
      - name: SEO and GEO deployment configuration
        run: python3 -m unittest tests.seo_configuration_test -v
      - name: Repository documentation hygiene
        run: python3 -m unittest tests.repository_hygiene_test -v
      - name: Frontend briefing, navigation, and search regressions
        run: python3 -m unittest tests.frontend_briefing_ui_test -v

  hero-retry:
    name: Hero image retry-window guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Guards the daily hero image retry window. On 2026-06-26 a single provider
    # disconnect dropped the hero (no retry); on 2026-06-27 the 3-attempt/~25s
    # window was too shallow and the hero dropped AGAIN even though a manual
    # regen minutes later succeeded. This test locks in the multi-minute retry
    # window + transient-failure handling so neither regression can silently
    # return. Needs the three deps image_client imports at module load.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            generators
            tests
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install minimal deps for image_client import
        run: python3 -m pip install --no-input "httpx>=0.27.0" "google-genai>=1.0.0" "Pillow>=10.0.0"
      - name: Hero image retry behavior
        run: python3 -m unittest tests.image_client_retry_test -v

  container-smoke:
    name: Docker no-spend smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production container
        run: docker build --tag wiredframe-radar:test .
      - name: Start web-only and verify health
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name wiredframe-radar-test \
            --publish 7100:80 \
            --env ENABLE_CRON=false \
            wiredframe-radar:test
          trap 'docker rm --force wiredframe-radar-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:7100/ >/dev/null; then
              docker exec wiredframe-radar-test test -f /app/config/providers.yaml
              docker exec wiredframe-radar-test test -f /app/config/prompts.yaml
              exit 0
            fi
            sleep 2
          done
          docker logs wiredframe-radar-test
          exit 1
