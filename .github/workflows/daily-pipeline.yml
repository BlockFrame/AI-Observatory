name: Daily Pipeline

on:
  schedule:
    # GitHub cron is UTC-only. These two entries cover 1 AM America/New_York
    # across daylight saving time; the ET gate below lets only the nominal
    # 1 AM run continue even when GitHub starts the runner late.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Report date to generate (YYYY-MM-DD). Defaults to today in ET."
        required: false
        type: string
      resume_from:
        description: "Optional pipeline phase to resume from, for manual recovery."
        required: false
        type: string
      commit_outputs:
        description: "Commit and push generated outputs after the run."
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-pipeline-${{ github.ref }}
  # Only a manual dispatch cancels an in-flight run, so a manual re-run
  # supersedes an overlapping scheduled run instead of double-publishing the
  # same day (see the 2026-07-08 double run). Scheduled runs must NOT cancel
  # each other: the two DST-backstop crons (0 5 / 0 6) intentionally overlap and
  # rely on the ET gate below to pick the nominal 1 AM run. A plain
  # `cancel-in-progress: true` would let the 6 AM UTC cron kill the still-running
  # 1 AM run, then gate itself out — publishing nothing.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  daily-pipeline:
    name: Generate and publish daily data
    if: github.repository == 'BlockFrame/wiredframe-radar'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: America/New_York
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_COMPLEX_MAX_INPUT_PER_MTOK: ${{ vars.OPENROUTER_COMPLEX_MAX_INPUT_PER_MTOK || '0.24' }}
      OPENROUTER_COMPLEX_MAX_OUTPUT_PER_MTOK: ${{ vars.OPENROUTER_COMPLEX_MAX_OUTPUT_PER_MTOK || '0.96' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # Telegram delivery intentionally disabled until explicitly re-enabled.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GETXAPI_KEY: ${{ secrets.GETXAPI_KEY || secrets.TWITTERAPI_IO_KEY }}
      LESSWRONG_PROXY_URL: ${{ secrets.LESSWRONG_PROXY_URL }}
      PIPELINE_PROXY_URL: ${{ secrets.PIPELINE_PROXY_URL }}
      MULLVAD_ACCOUNT: ${{ secrets.MULLVAD_ACCOUNT }}
      MULLVAD_WG_PRIVATE_KEY: ${{ secrets.MULLVAD_WG_PRIVATE_KEY }}
      MULLVAD_RELAY_FILTER: ${{ vars.MULLVAD_RELAY_FILTER || 'us' }}
      PIPELINE_BASE_URL: ${{ vars.PIPELINE_BASE_URL || 'https://radar.wiredframe.xyz' }}
      PIPELINE_COMMIT_PATHS: ${{ vars.PIPELINE_COMMIT_PATHS || 'web/data llms.txt ai-index.json config/model_releases.yaml config/ecosystem_context.yaml' }}
      PIPELINE_IMAGE_MODEL: ${{ vars.PIPELINE_IMAGE_MODEL || 'gemini-3-pro-image-preview' }}
      LLM_TRUST_ENV_PROXY: ${{ vars.LLM_TRUST_ENV_PROXY || 'false' }}
      # Leave unset unless explicitly overridden so each provider route can use
      # its own timeout and fail over before a single request consumes 240s.
      LLM_TIMEOUT_SECONDS: ${{ vars.LLM_TIMEOUT_SECONDS }}
      LLM_MAX_CONCURRENT_REQUESTS: ${{ vars.LLM_MAX_CONCURRENT_REQUESTS || '8' }}
      LLM_ADAPTIVE_MAX_TOKENS: ${{ vars.LLM_ADAPTIVE_MAX_TOKENS || '65536' }}
      LLM_MAX_RETRIES: ${{ vars.LLM_MAX_RETRIES || '2' }}
      LLM_LOG_REQUESTS: ${{ vars.LLM_LOG_REQUESTS || 'true' }}
      LLM_HEARTBEAT_SECONDS: ${{ vars.LLM_HEARTBEAT_SECONDS || '60' }}
      LLM_METRICS_PATH: ${{ vars.LLM_METRICS_PATH || 'data/llm_metrics.jsonl' }}
      LLM_ROUTE_COOLDOWN_SECONDS: ${{ vars.LLM_ROUTE_COOLDOWN_SECONDS || '120' }}
      LLM_ROUTE_MAX_COOLDOWN_SECONDS: ${{ vars.LLM_ROUTE_MAX_COOLDOWN_SECONDS || '1800' }}
      SEMANTIC_DEDUP_USE_LLM: 'false'
      SENTIMENT_USE_LLM: 'false'
      ANALYZER_BATCH_SIZE: ${{ vars.ANALYZER_BATCH_SIZE || '25' }}
      ANALYZER_MAX_CONCURRENT_BATCHES: ${{ vars.ANALYZER_MAX_CONCURRENT_BATCHES || '1' }}
      ANALYZER_MIN_BATCH_COVERAGE: ${{ vars.ANALYZER_MIN_BATCH_COVERAGE || '0.85' }}
      SOCIAL_ANALYSIS_MAX_ITEMS: ${{ vars.SOCIAL_ANALYSIS_MAX_ITEMS || '150' }}
      MAX_ANALYSIS_FALLBACK_RATE: ${{ vars.MAX_ANALYSIS_FALLBACK_RATE || '0.20' }}
      TARGET_DATE_INPUT: ${{ inputs.target_date || '' }}
      RESUME_FROM_INPUT: ${{ inputs.resume_from || '' }}
      COMMIT_OUTPUTS: ${{ github.event_name != 'workflow_dispatch' || inputs.commit_outputs }}

    steps:
      - name: Check 1 AM ET schedule gate
        id: schedule_gate
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: bypassing ET schedule gate."
            exit 0
          fi

          if [[ -z "${SCHEDULE_CRON:-}" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled run is missing github.event.schedule; exiting as a no-op."
            exit 0
          fi

          nominal_info="$(
            python3 <<'PY'
          from datetime import datetime, timezone
          from os import environ
          from zoneinfo import ZoneInfo

          cron = environ["SCHEDULE_CRON"]
          parts = cron.split()
          if len(parts) < 2:
              raise SystemExit(f"Unsupported schedule expression: {cron!r}")

          minute = int(parts[0])
          hour = int(parts[1])
          et_today = datetime.now(ZoneInfo("America/New_York")).date()
          nominal_utc = datetime(
              et_today.year,
              et_today.month,
              et_today.day,
              hour,
              minute,
              tzinfo=timezone.utc,
          )
          nominal_et = nominal_utc.astimezone(ZoneInfo("America/New_York"))
          should_run = nominal_et.hour == 1 and nominal_et.minute == 0

          print(f"should_run={'true' if should_run else 'false'}")
          print(f"nominal_utc={nominal_utc.strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print(f"nominal_et={nominal_et.strftime('%Y-%m-%d %H:%M:%S %Z')}")
          PY
          )"

          should_run="$(awk -F= '/^should_run=/{print $2}' <<< "$nominal_info")"
          nominal_utc="$(awk -F= '/^nominal_utc=/{print $2}' <<< "$nominal_info")"
          nominal_et="$(awk -F= '/^nominal_et=/{print $2}' <<< "$nominal_info")"
          actual_et="$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')"

          if [[ "$should_run" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled cron '$SCHEDULE_CRON' maps to $nominal_et ($nominal_utc); continuing."
            echo "Actual runner start time was $actual_et."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled cron '$SCHEDULE_CRON' maps to $nominal_et ($nominal_utc), not 1 AM ET; exiting as a no-op."
            echo "Actual runner start time was $actual_et."
          fi

      - name: Check out publishing main
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # A repository-scoped writable deploy key is the only automation
          # allowed to bypass the main-branch ruleset for validated reports.
          ssh-key: ${{ secrets.PIPELINE_PUSH_KEY }}

      - name: Resolve report date
        if: steps.schedule_gate.outputs.should_run == 'true'
        id: report_date
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TARGET_DATE_INPUT:-}" ]]; then
            report_date="$TARGET_DATE_INPUT"
          else
            # A GitHub rerun can happen on a later calendar day. Anchor the
            # report to the original workflow run creation time, not to "now",
            # so its X coverage window and gathering cache remain unchanged.
            run_json="$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            created_at="$(jq -r '.created_at // empty' <<< "$run_json")"
            if [[ -z "$created_at" ]]; then
              echo "Could not resolve the original workflow run date; refusing an ambiguous collection." >&2
              exit 1
            fi
            report_date="$(TZ=America/New_York date -d "$created_at" +%F)"
          fi
          echo "date=$report_date" >> "$GITHUB_OUTPUT"
          echo "Report date pinned to $report_date."

      - name: Verify paid model promotional pricing
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # This is intentionally the first post-checkout operation: a missing
          # promotion must stop before dependency installation, X collection,
          # scraping, or any LLM request consumes resources.
          python3 scripts/check_openrouter_pricing.py

      - name: Restore completed gathering checkpoint
        if: steps.schedule_gate.outputs.should_run == 'true'
        id: gathering_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/checkpoints/${{ steps.report_date.outputs.date }}/gathering.json
          key: gathering-v3-${{ steps.report_date.outputs.date }}-${{ hashFiles('config/twitter_accounts.txt', 'config/rss_feeds.txt', 'config/research_feeds.txt', 'config/web_scraper_sources.txt', 'config/research_web_sources.txt') }}

      - name: Set up Python
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Verify API Keys
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "ERROR: GEMINI_API_KEY secret is empty - set it in GitHub repo secrets." >&2
            exit 1
          fi
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "ERROR: OPENROUTER_API_KEY secret is empty - paid MiniMax complex-task route cannot start." >&2
            exit 1
          fi
          echo "API keys verified."

      - name: Run pipeline regression tests before paid API calls
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        env:
          # Regression tests use mocks. Explicitly shadow production secrets so
          # a future test cannot accidentally consume provider or GetX quota.
          GETXAPI_KEY: ""
          GEMINI_API_KEY: "unit-test-key"
          NVIDIA_API_KEY: "unit-test-key"
          OPENROUTER_API_KEY: "unit-test-key"
          LLM_LOG_REQUESTS: "false"
          LLM_METRICS_PATH: ""
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.research_gatherer_test \
            tests.llm_routing_test \
            tests.editorial_integrity_test \
            tests.news_ai_keyword_filter_test \
            tests.pipeline_resilience_test \
            tests.openrouter_pricing_test \
            tests.summary_context_test

      - name: Start Mullvad tunnel for hosted egress
        if: steps.schedule_gate.outputs.should_run == 'true' && env.MULLVAD_ACCOUNT != '' && env.PIPELINE_PROXY_URL == ''
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wireguard-tools
          python -m pip install cryptography

          tmp_dir="$(mktemp -d)"
          settings_file="$tmp_dir/settings.conf"
          curl -fsSL \
            https://raw.githubusercontent.com/mullvad/wg-tools/c85b7ed35bdb6e0bd38fa24481819088fa6a68c5/wg-mullvad.py \
            -o "$tmp_dir/wg-mullvad.py"

          if [[ -n "${MULLVAD_WG_PRIVATE_KEY:-}" ]]; then
            umask 077
            {
              echo "[Interface]"
              echo "privatekey = ${MULLVAD_WG_PRIVATE_KEY}"
            } > "$settings_file"
          fi

          python "$tmp_dir/wg-mullvad.py" \
            --account "$MULLVAD_ACCOUNT" \
            --filter "$MULLVAD_RELAY_FILTER" \
            --active \
            --settings-file "$settings_file" \
            --output-dir "$tmp_dir/wg"

          wg_conf="$(find "$tmp_dir/wg" -name '*.conf' | sort | head -1)"
          if [[ -z "$wg_conf" ]]; then
            echo "No Mullvad WireGuard config generated." >&2
            exit 1
          fi

          sudo sed -i '/^dns[[:space:]]*=/Id' "$wg_conf"
          sudo sed -i 's#^allowedips[[:space:]]*=.*#allowedips = 10.64.0.1/32#I' "$wg_conf"
          sudo wg-quick up "$wg_conf"

          {
            echo "PIPELINE_PROXY_URL=socks5h://10.64.0.1:1080"
          } >> "$GITHUB_ENV"
          proxy_ip="$(curl -fsSL --proxy socks5h://10.64.0.1:1080 https://am.i.mullvad.net/ip || true)"
          if [[ -n "$proxy_ip" ]]; then
            echo "Mullvad SOCKS proxy is reachable."
          else
            echo "Mullvad SOCKS proxy did not return an external IP smoke-test response." >&2
          fi

      - name: Run pipeline
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${PIPELINE_PROXY_URL:-}" ]]; then
            export ALL_PROXY="$PIPELINE_PROXY_URL"
            export HTTPS_PROXY="$PIPELINE_PROXY_URL"
            export HTTP_PROXY="$PIPELINE_PROXY_URL"
            export all_proxy="$PIPELINE_PROXY_URL"
            export https_proxy="$PIPELINE_PROXY_URL"
            export http_proxy="$PIPELINE_PROXY_URL"
            export NO_PROXY="localhost,127.0.0.1,::1"
            export no_proxy="$NO_PROXY"
            echo "Pipeline-wide proxy is configured."
          fi

          args=(
            --config-dir ./config
            --data-dir ./data
            --web-dir ./web
            --date "${{ steps.report_date.outputs.date }}"
          )
          if [[ -n "${RESUME_FROM_INPUT:-}" ]]; then
            args+=(--resume-from "$RESUME_FROM_INPUT")
          elif [[ -f "data/checkpoints/${{ steps.report_date.outputs.date }}/gathering.json" ]]; then
            echo "Reusing completed gathering checkpoint; paid X collection will be skipped."
            args+=(--resume-from 2)
          fi
          python3 run_pipeline.py "${args[@]}"

      - name: Inspect gathering checkpoint for reuse
        if: always() && steps.schedule_gate.outputs.should_run == 'true'
        id: gathering_checkpoint
        shell: bash
        run: |
          set -euo pipefail
          checkpoint="data/checkpoints/${{ steps.report_date.outputs.date }}/gathering.json"
          if [[ ! -f "$checkpoint" ]]; then
            echo "reusable=false" >> "$GITHUB_OUTPUT"
            echo "No completed gathering checkpoint is available."
            exit 0
          fi
          if python3 - "$checkpoint" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              checkpoint = json.load(handle)
          twitter = (checkpoint.get("collection_status") or {}).get("social_twitter") or {}
          if twitter.get("status") != "success":
              raise SystemExit(
                  f"GetXAPI collection is not reusable: status={twitter.get('status')!r}"
              )
          categories = checkpoint.get("categories")
          if not isinstance(categories, dict) or not isinstance(categories.get("social"), list):
              raise SystemExit("Gathering checkpoint has no valid social category")
          PY
          then
            echo "reusable=true" >> "$GITHUB_OUTPUT"
            echo "Gathering checkpoint is reusable; GetXAPI collection completed successfully."
          else
            echo "reusable=false" >> "$GITHUB_OUTPUT"
            echo "Gathering checkpoint will not be cached because GetXAPI was incomplete." >&2
          fi

      - name: Save completed gathering checkpoint
        if: ${{ always() && steps.schedule_gate.outputs.should_run == 'true' && steps.gathering_cache.outputs.cache-hit != 'true' && steps.gathering_checkpoint.outputs.reusable == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/checkpoints/${{ steps.report_date.outputs.date }}/gathering.json
          key: gathering-v3-${{ steps.report_date.outputs.date }}-${{ hashFiles('config/twitter_accounts.txt', 'config/rss_feeds.txt', 'config/research_feeds.txt', 'config/web_scraper_sources.txt', 'config/research_web_sources.txt') }}

      - name: Verify llms index artifacts
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f llms.txt
          test -f ai-index.json

      - name: Validate generated report (publish gate)
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          report_date="${{ steps.report_date.outputs.date }}"
          # The pipeline can exit 0 even when Topic Detection / Executive Summary
          # failed (those phases catch their own errors and write failure sentinels
          # into summary.json). Validate the actual user-facing artifact so we never
          # publish a "generation failed" report. Exit 1 here fails the job and
          # blocks the commit; the revert step below restores the prior good data.
          python3 scripts/validate_report.py --web-dir ./web --date "$report_date"

      # Capture the candidate report before the failure cleanup removes it. This
      # keeps quality/evidence diagnostics available when the publish gate fails.
      - name: Upload pipeline diagnostics
        if: always() && steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-diagnostics
          path: |
            data/llm_metrics.jsonl
            data/checkpoints/*/gathering.json
            web/data/*/cost_report.json
            web/data/*/summary.json
            web/data/*/endpoint_status.json
          if-no-files-found: ignore

      - name: Discard invalid generated data (keep last good report)
        if: failure() && steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # If validation (or anything before the commit) failed, do not leave a
          # broken report staged/committed. Restore tracked files and drop any
          # untracked generated output so the previously published report stands.
          read -r -a commit_paths <<< "$PIPELINE_COMMIT_PATHS"
          echo "Reverting generated paths after failure: ${commit_paths[*]}"
          git checkout -- "${commit_paths[@]}" 2>/dev/null || true
          git clean -fd -- "${commit_paths[@]}" 2>/dev/null || true

      - name: Commit generated outputs
        if: steps.schedule_gate.outputs.should_run == 'true' && env.COMMIT_OUTPUTS == 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          read -r -a commit_paths <<< "$PIPELINE_COMMIT_PATHS"
          git add -- "${commit_paths[@]}"

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No generated output changes to commit."
            exit 0
          fi

          report_date="${{ steps.report_date.outputs.date }}"
          git commit -m "data: Auto-update ${report_date}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Upload generated outputs without committing
        if: steps.schedule_gate.outputs.should_run == 'true' && env.COMMIT_OUTPUTS != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-pipeline-output
          path: |
            web/data
            config/model_releases.yaml
            config/ecosystem_context.yaml
          if-no-files-found: error

      - name: Push generated commit
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.commit.outputs.committed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Ensure a clean tree before rebasing/pushing the generated commit.
          git checkout -- .
          git clean -fd

          # Avoid `git pull --rebase` flakiness (exit 128 on detached/non-branch
          # states or transient race windows). Rebase explicitly on origin/main,
          # then push with retries in case another commit lands first.
          git fetch origin main
          git rebase origin/main

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); refetching and rebasing..."
            git fetch origin main
            git rebase origin/main
            sleep 2
          done

          echo "ERROR: failed to push generated commit after retries" >&2
          exit 1
      # ---------------------------------------------------------------------
      # Detection gap fix (2026-06-21): a scheduled run can exit 0 without ever
      # producing today's report. The 1 AM ET gate makes the OTHER scheduled
      # entry exit as a 7-second "success" no-op, and a run that does real work
      # but fails synthesis gets reverted by the publish gate (last good report
      # stays live) WITHOUT failing loudly. Either way the site silently serves
      # stale content. This step runs only on the nominal 1 AM ET pass (the one
      # that is SUPPOSED to publish) and asserts a `data: Auto-update <today>`
      # commit actually landed on origin/main. If not, it fails the job, which
      # triggers the failure-alert step below.
      - name: Assert today's report is published on origin/main
        if: steps.schedule_gate.outputs.should_run == 'true' && env.COMMIT_OUTPUTS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          report_date="${{ steps.report_date.outputs.date }}"
          git fetch origin main --quiet
          # Verify the actual published artifact for report_date exists on the live
          # branch. This is commit-timing independent (no false positives on same-day
          # re-dispatches or backfills where nothing new was committed), and directly
          # answers "is the site serving today's report?" If summary.json for the date
          # is absent from origin/main, the run claimed success but the site is STALE.
          artifact="web/data/${report_date}/summary.json"
          if git cat-file -e "origin/main:${artifact}" 2>/dev/null; then
            echo "Verified: ${artifact} is published on origin/main."
          else
            echo "::error::${artifact} is NOT on origin/main after a run that was \
          supposed to publish. The site is serving STALE content for ${report_date}." >&2
            echo "Recent origin/main subjects:" >&2
            git log origin/main -8 --pretty='  %h %s' >&2
            exit 1
          fi

      - name: Record pipeline failure incident
        if: failure() && steps.schedule_gate.outputs.should_run == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="[Operations] Daily pipeline publication failure"
          report_date="${{ steps.report_date.outputs.date }}"
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "${title} in:title" --json number --jq '.[0].number // empty')"
          body="Daily publication failed for **${report_date}**.\n\nRun: ${RUN_URL}\n\nThe last validated report remains online."
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" \
              --label "area: operations" --label "priority: high" --label "status: triage"
          fi

      - name: Resolve pipeline failure incident
        if: success() && steps.schedule_gate.outputs.should_run == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="[Operations] Daily pipeline publication failure"
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --comment "Publication recovered successfully. Run: ${RUN_URL}"
          fi
