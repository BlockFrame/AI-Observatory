llm:
  mode: "gemini"
  api_key: "${GEMINI_API_KEY}"
  model: "gemini-3.5-flash-lite"
  max_output_tokens: 65536
  timeout: 600
  requests_per_minute: 15
  tokens_per_minute: 250000
  requests_per_day: 500
  routes:
    - id: "glm-bulk"
      mode: "openai-compatible"
      api_key: "${ZHIPU_API_KEY}"
      base_url: "https://open.bigmodel.cn/api/paas/v4/"
      model: "glm-4.7-flash"
      max_concurrent_requests: 1
      requests_per_minute: 10
      profiles: ["QUICK", "STANDARD"]
      fallback_route_id: "gemini-bulk-fallback"

    - id: "gemini-bulk-fallback"
      mode: "gemini"
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-3.5-flash-lite"
      max_output_tokens: 65536
      max_concurrent_requests: 6
      requests_per_minute: 15
      tokens_per_minute: 250000
      requests_per_day: 500
      profiles: ["QUICK", "STANDARD"]
      fallback_route_id: "nvidia-deepseek-bulk"

    - id: "nvidia-deepseek-bulk"
      mode: "openai-compatible"
      api_key: "${NVIDIA_API_KEY}"
      base_url: "https://integrate.api.nvidia.com/v1"
      model: "deepseek-ai/deepseek-v4-flash"
      max_output_tokens: 16384
      max_concurrent_requests: 4
      profiles: ["QUICK", "STANDARD"]
      fallback_route_id: "nvidia-deepseek-quality"

    - id: "nvidia-deepseek-quality"
      mode: "openai-compatible"
      api_key: "${NVIDIA_API_KEY}"
      base_url: "https://integrate.api.nvidia.com/v1"
      model: "deepseek-ai/deepseek-r1"
      max_output_tokens: 16384
      max_concurrent_requests: 4
      profiles: ["STANDARD", "DEEP", "ULTRATHINK"]
      fallback_route_id: "gemini-quality-fallback"
      caller_patterns:
        - "orchestrator.*"
        - "*_analyzer.reduce_rank"
        - "link_enricher.*"

    - id: "gemini-quality-fallback"
      mode: "gemini"
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-3.6-flash"
      max_output_tokens: 65536
      max_concurrent_requests: 2
      requests_per_minute: 5
      tokens_per_minute: 250000
      requests_per_day: 20
      profiles: ["STANDARD", "DEEP", "ULTRATHINK"]

# image section disabled - no GOOGLE_API_KEY configured
# To enable hero image generation, add GOOGLE_API_KEY secret and uncomment:
# image:
#   mode: "native"
#   api_key: "${GOOGLE_API_KEY}"
#   model: "gemini-3-pro-image-preview"

pipeline:
  base_url: "https://ai-observatory.vercel.app"
  lookback_hours: 24
