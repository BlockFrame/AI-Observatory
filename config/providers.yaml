llm:
  mode: "gemini"
  api_key: "${GEMINI_API_KEY}"
  model: "gemini-3.5-flash-lite"
  max_output_tokens: 65536
  timeout: 120
  requests_per_minute: 15
  tokens_per_minute: 250000
  requests_per_day: 500
  routes:
    - id: "nvidia-nemotron-bulk"
      mode: "openai-compatible"
      api_key: "${NVIDIA_API_KEY}"
      base_url: "https://integrate.api.nvidia.com/v1"
      model: "nvidia/nemotron-3-nano-30b-a3b"
      timeout: 120
      max_output_tokens: 16384
      max_concurrent_requests: 2
      requests_per_minute: 30
      profiles: ["QUICK", "STANDARD", "DEEP"]
      fallback_route_id: "glm-bulk"

    - id: "glm-bulk"
      mode: "openai-compatible"
      api_key: "${ZHIPU_API_KEY}"
      base_url: "https://open.bigmodel.cn/api/paas/v4/"
      model: "glm-4.7-flash"
      max_concurrent_requests: 1
      requests_per_minute: 10
      profiles: ["QUICK", "STANDARD", "DEEP"]
      fallback_route_id: "gemini-bulk-fallback"

    - id: "gemini-bulk-fallback"
      mode: "gemini"
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-3.5-flash-lite"
      max_output_tokens: 65536
      max_concurrent_requests: 6
      requests_per_minute: 15
      tokens_per_minute: 250000
      requests_per_day: 500
      profiles: ["QUICK", "STANDARD", "DEEP"]
      fallback_route_id: "gemini-bulk-fallback-3.1"

    - id: "gemini-bulk-fallback-3.1"
      mode: "gemini"
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-3.1-flash-lite"
      max_output_tokens: 65536
      max_concurrent_requests: 6
      requests_per_minute: 15
      tokens_per_minute: 250000
      requests_per_day: 500
      profiles: ["QUICK", "STANDARD", "DEEP"]

    - id: "nvidia-glm-quality"
      mode: "openai-compatible"
      api_key: "${NVIDIA_API_KEY}"
      base_url: "https://integrate.api.nvidia.com/v1"
      model: "z-ai/glm-5.2"
      timeout: 180
      max_output_tokens: 16384
      max_concurrent_requests: 1
      requests_per_minute: 30
      profiles: ["STANDARD", "DEEP", "ULTRATHINK"]
      fallback_route_id: "gemini-quality-fallback-3.5"
      caller_patterns:
        - "*_analyzer.reduce_rank"

    - id: "gemini-quality-fallback"
      mode: "gemini"
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-3.6-flash"
      timeout: 90
      max_output_tokens: 65536
      max_concurrent_requests: 2
      requests_per_minute: 5
      tokens_per_minute: 250000
      requests_per_day: 20
      profiles: ["STANDARD", "DEEP", "ULTRATHINK"]
      fallback_route_id: "gemini-quality-fallback-3.5"
      caller_patterns:
        - "orchestrator.*"
        - "link_enricher.*"
        - "analysis.*_summary"

    - id: "gemini-quality-fallback-3.5"
      mode: "gemini"
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-3.5-flash"
      timeout: 90
      max_output_tokens: 65536
      max_concurrent_requests: 2
      requests_per_minute: 5
      tokens_per_minute: 250000
      requests_per_day: 20
      profiles: ["STANDARD", "DEEP", "ULTRATHINK"]
      fallback_route_id: "gemini-quality-fallback-lite-3.5"
      caller_patterns:
        - "*_analyzer.reduce_rank"
        - "orchestrator.*"
        - "link_enricher.*"
        - "analysis.*_summary"

    - id: "gemini-quality-fallback-lite-3.5"
      mode: "gemini"
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-3.5-flash-lite"
      timeout: 90
      max_output_tokens: 65536
      max_concurrent_requests: 6
      requests_per_minute: 15
      tokens_per_minute: 250000
      requests_per_day: 500
      profiles: ["STANDARD", "DEEP", "ULTRATHINK"]
      caller_patterns:
        - "*_analyzer.reduce_rank"
        - "orchestrator.*"
        - "link_enricher.*"
        - "analysis.*_summary"

# image section disabled - no GOOGLE_API_KEY configured
# To enable hero image generation, add GOOGLE_API_KEY secret and uncomment:
# image:
#   mode: "native"
#   api_key: "${GOOGLE_API_KEY}"
#   model: "gemini-3-pro-image-preview"

pipeline:
  base_url: "https://ai-observatory.vercel.app"
  lookback_hours: 24
