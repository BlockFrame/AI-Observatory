llm:
  mode: "gemini"
  api_key: "${GEMINI_API_KEY}"
  model: "gemini-3.5-flash-lite"
  max_output_tokens: 65536
  timeout: 120
  requests_per_minute: 15
  tokens_per_minute: 250000
  requests_per_day: 500
  routes:
    # MiniMax also handles per-item analysis and lightweight editorial calls.
    # This keeps one quality level across the pipeline while preserving a
    # cheaper/quota-separated fallback chain for bulk work.
    - id: "openrouter-minimax-bulk"
      priority: 100
      mode: "openrouter"
      api_key: "${OPENROUTER_API_KEY}"
      base_url: "https://openrouter.ai/api/v1"
      model: "minimax/minimax-m3"
      timeout: 240
      max_output_tokens: 32768
      max_concurrent_requests: 2
      profiles: ["QUICK", "STANDARD", "DEEP"]
      fallback_route_id: "gemini-bulk-fallback"

    - id: "gemini-bulk-fallback"
      priority: 90
      mode: "gemini"
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-3.5-flash-lite"
      max_output_tokens: 65536
      max_concurrent_requests: 6
      requests_per_minute: 15
      tokens_per_minute: 250000
      requests_per_day: 500
      profiles: ["QUICK", "STANDARD", "DEEP"]
      fallback_route_id: "gemini-bulk-fallback-3.1"

    - id: "gemini-bulk-fallback-3.1"
      priority: 80
      mode: "gemini"
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-3.1-flash-lite"
      max_output_tokens: 65536
      max_concurrent_requests: 6
      requests_per_minute: 15
      tokens_per_minute: 250000
      requests_per_day: 500
      profiles: ["QUICK", "STANDARD", "DEEP"]

    # Paid MiniMax M3 is reserved for synthesis/ranking. The workflow verifies
    # its promotional price before collection and the request repeats the same
    # price cap, so an expired offer cannot silently increase spend.
    - id: "openrouter-minimax-complex"
      priority: 110
      mode: "openrouter"
      api_key: "${OPENROUTER_API_KEY}"
      base_url: "https://openrouter.ai/api/v1"
      model: "minimax/minimax-m3"
      timeout: 240
      max_output_tokens: 32768
      max_concurrent_requests: 2
      profiles: ["STANDARD", "DEEP", "ULTRATHINK"]
      fallback_route_id: "gemini-quality-fallback"
      caller_patterns:
        - "news_analyzer.small_batch"
        - "*_analyzer.reduce_rank"
        - "analysis.*_summary"
        - "orchestrator.topics"
        - "orchestrator.summary"

    # Gemini Flash Lite follows the upstream AATF enrichment contract and
    # returns the complete text with contextual links. LinkEnricher validates
    # that the prose is unchanged and that every URL targets an eligible item.
    # QUICK avoids spending the output budget on unnecessary model reasoning.
    # One concurrent request and the Flash Lite free-tier 15 RPM cap keep this
    # below the provider limit without creating burst traffic;
    # a maximum of eleven sections are enriched in one pipeline run.
    - id: "gemini-link-enrichment"
      priority: 120
      mode: "gemini"
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-3.5-flash-lite"
      timeout: 90
      max_output_tokens: 8192
      max_concurrent_requests: 1
      requests_per_minute: 15
      tokens_per_minute: 250000
      requests_per_day: 500
      allow_cross_route_fallback: false
      profiles: ["QUICK"]
      caller_patterns:
        - "link_enricher.*"

    - id: "gemini-quality-fallback"
      priority: 100
      mode: "gemini"
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-3.6-flash"
      timeout: 90
      max_output_tokens: 65536
      max_concurrent_requests: 2
      requests_per_minute: 5
      tokens_per_minute: 250000
      requests_per_day: 20
      profiles: ["STANDARD", "DEEP", "ULTRATHINK"]
      fallback_route_id: "nvidia-glm-orchestration-backup"
      caller_patterns:
        - "news_analyzer.small_batch"
        - "*_analyzer.reduce_rank"
        - "orchestrator.topics"
        - "orchestrator.summary"
        - "analysis.*_summary"

    - id: "nvidia-glm-orchestration-backup"
      priority: 90
      mode: "openai-compatible"
      api_key: "${NVIDIA_API_KEY}"
      base_url: "https://integrate.api.nvidia.com/v1"
      model: "z-ai/glm-5.2"
      timeout: 180
      max_output_tokens: 16384
      max_concurrent_requests: 1
      requests_per_minute: 30
      profiles: ["STANDARD", "DEEP", "ULTRATHINK"]
      fallback_route_id: "gemini-quality-fallback-3.5"
      caller_patterns:
        - "news_analyzer.small_batch"
        - "*_analyzer.reduce_rank"
        - "orchestrator.topics"
        - "orchestrator.summary"
        - "analysis.*_summary"

    - id: "gemini-quality-fallback-3.5"
      priority: 80
      mode: "gemini"
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-3.5-flash"
      timeout: 90
      max_output_tokens: 65536
      max_concurrent_requests: 2
      requests_per_minute: 5
      tokens_per_minute: 250000
      requests_per_day: 20
      profiles: ["STANDARD", "DEEP", "ULTRATHINK"]
      fallback_route_id: "gemini-quality-fallback-lite-3.5"
      caller_patterns:
        - "news_analyzer.small_batch"
        - "*_analyzer.reduce_rank"
        - "orchestrator.*"
        - "link_enricher.*"
        - "analysis.*_summary"

    - id: "gemini-quality-fallback-lite-3.5"
      priority: 70
      mode: "gemini"
      api_key: "${GEMINI_API_KEY}"
      model: "gemini-3.5-flash-lite"
      timeout: 90
      max_output_tokens: 65536
      max_concurrent_requests: 6
      requests_per_minute: 15
      tokens_per_minute: 250000
      requests_per_day: 500
      profiles: ["STANDARD", "DEEP", "ULTRATHINK"]
      caller_patterns:
        - "news_analyzer.small_batch"
        - "*_analyzer.reduce_rank"
        - "orchestrator.*"
        - "link_enricher.*"
        - "analysis.*_summary"

# image section disabled - no GOOGLE_API_KEY configured
# To enable hero image generation, add GOOGLE_API_KEY secret and uncomment:
# image:
#   mode: "native"
#   api_key: "${GOOGLE_API_KEY}"
#   model: "gemini-3-pro-image-preview"

pipeline:
  base_url: "https://ai-observatory.vercel.app"
  lookback_hours: 24
