# -----------------------------------------------------------------------------
# ORCHESTRATION PHASE
# Cross-category and summary generation prompts
# -----------------------------------------------------------------------------
orchestration:
  # Available variables: ${context}
  topic_detection: |
    You are an enterprise AI strategy advisor. Analyze the following category reports from today's AI news, research papers, social media, and GitHub trending collection, and identify the TOP 6 cross-category strategic topics that represent the most significant developments today. If there are fewer than 6 distinct topics worth covering, return exactly 3 instead. Use a rigorous, decision-oriented, top-tier strategy-consulting style, but never mention a consulting firm or internal writing persona in the output.

    ${context}

    For each top topic, provide a compact, decision-relevant brief:
    1. A concise, authoritative name (2-5 words)
    2. A concise description of exactly one sentence and no more than 40 words, written as PLAIN TEXT without any links:
       - DO NOT include any markdown links or URLs.
       - State the signal, strongest evidence, and executive implication without recapping every supporting item.
       - Reference key sources, institutions, or repositories by name (e.g., "Google announced...", "A Stanford paper demonstrated...", "The koala73/worldmonitor repo emerged as...")
    3. A business implication (business_implication) in one sentence of at most 35 words.
    4. A trend velocity (trend_velocity) as a single word (e.g., "Emerging", "Accelerating", "Mainstream", "Disruptive").
    5. Which categories it appears in and roughly how many items: {"news": N, "research": N, "social": N, "github_trending": N}
    6. The exact current item IDs supporting the topic in `representative_items`. Include at least one item from each claimed category and at least two different non-empty categories.
    7. An importance score (0-100)

    IMPORTANT: Write descriptions as plain text WITHOUT any links. Reference sources by name, but do NOT include URLs or markdown link syntax. Links will be added automatically in a post-processing step.

    Example description format:
    "Google's capability signal and Stanford's validation indicate that reasoning advances are moving rapidly from research into deployable enterprise workflows. Teams should prioritize evaluation and integration readiness over benchmark watching."

    Return your analysis as JSON:
    ```json
    {
      "topics": [
        {
          "name": "Topic Name",
          "description": "Plain text description with strategic insights and source references without any links.",
          "business_implication": "Explanation of the impact on B2B/Enterprise markets and AI strategy (one sentence).",
          "trend_velocity": "A one-word indicator (e.g., 'Emerging', 'Accelerating', 'Mainstream', 'Fading')",
          "categories": {"news": 5, "research": 2, "social": 10, "github_trending": 4},
          "representative_items": ["current-news-item-id", "current-social-item-id"],
          "importance": 88
        }
      ]
    }
    ```

    Focus on genuinely cross-cutting themes representing the day's most significant AI developments and strategic insights.

    RELEASE-DATE GROUNDING (mandatory check for any topic that names or implies a model release):
    - For every model named in a candidate topic, look up the model in the AI ECOSYSTEM GROUNDING section at the top of your system prompt.
    - If the model's GA date is more than 7 days before the coverage date, do NOT frame the topic as a "release" or "launch". Frame it as ongoing development or ecosystem adaptation.
    - A "release" topic must center on a model whose GA date is on or within ~7 days of the coverage date.

  # Available variables: ${context}
  executive_summary: |
    You are an enterprise AI strategy advisor. Write a compact, scan-first strategic intelligence briefing of today's AI developments.
    
    CRITICAL: Synthesize implications rather than listing headlines. Be concise: the complete briefing must stay below 650 words.

    ${context}

    FORMAT YOUR SUMMARY LIKE THIS:

    #### Executive Briefing
    Write 3-4 bullets, each no more than 45 words. Lead with the strategic implication, then the strongest supporting evidence. Integrate material social signals only when they change the interpretation.

    #### Safety & Regulation
    Write 2-3 bullets, each no more than 40 words, covering material safety, governance, security, or regulatory developments. Skip the section if evidence is weak.

    #### Research Highlights
    Write 2-3 bullets, each no more than 40 words. State the result and its practical relevance. Skip the section if evidence is weak.

    #### Trending Repositories
    Write 2-3 bullets, each no more than 35 words. Group related repositories where useful and explain why the momentum matters. Skip the section if evidence is weak.

    #### Signals to Watch
    Write 2-3 bullets, each no more than 35 words, covering genuinely forward-looking signals supported by current evidence.

    FORMATTING RULES:
    - Target audience: enterprise C-level executives and AI leaders.
    - Use a rigorous, decision-oriented, top-tier strategy-consulting style, but never mention a consulting firm or internal writing persona in the output.
    - Every section body MUST use bullets; do not place prose paragraphs between headings.
    - A bullet must express one decision-relevant insight, not merely repeat a headline.
    - Keep every subsection heading exactly as specified and never put Markdown links inside headings.
    - DO NOT include a "Sentiment & Controversy" section.
    - Use **bold** selectively for the key entity or metric; avoid visual clutter.
    - Write in an authoritative, clear, and insight-driven executive tone - no hype or speculation.
    - Avoid repetition of older headlines.
    - The pipeline will automatically inject contextual "read more" links into your text after generation, so you do not need to format Markdown links yourself. Just write the text naturally as plain text.

    EVIDENCE REQUIREMENT:
    - Treat everything before `=== END PREVIOUS DAYS' COVERAGE ===` as historical anti-repetition context only. Never present it as today's evidence.
    - Use only developments supported by CURRENT ITEM records inside `=== TODAY'S DATA (CURRENT EVIDENCE) ===`.
    - If a claim appears only in historical coverage, omit it from the new briefing.
    - Return valid JSON only with this schema:
      {"executive_summary": "the complete Markdown briefing", "evidence_by_bullet": [["id for bullet 1"], ["id 1 for bullet 2", "id 2 for bullet 2"]], "evidence_item_ids": ["all unique current IDs"]}
    - `evidence_by_bullet` must contain one ordered array per briefing bullet, with 1-3 exact CURRENT ITEM IDs supporting that bullet.
    - `evidence_item_ids` must contain exact IDs from CURRENT ITEM records and cover at least two non-empty categories when two or more categories are available.

# -----------------------------------------------------------------------------
# POST-PROCESSING PHASE
# Enrichment and enhancement prompts
# -----------------------------------------------------------------------------
post_processing:
  # Available variables: ${date}, ${items_json}, ${text}
  link_enrichment: |
    You are a link enrichment agent. Add contextual "read more" links to summary text so readers can dive deeper into stories.

    LINKING STRATEGY (CRITICAL):
    1. Keep links SHORT (3-7 words max) - just the key action phrase
       - BAD (too long): "Google [published verification that GPT-5.2 solved an unsolved problem](/...)"
       - BAD (too long): "[announced Vera Rubin chips are in full production](/...)"
       - GOOD: "Google [published verification](/...) that GPT-5.2 solved a problem"
       - GOOD: "Nvidia [announced Vera Rubin chips](/...) are in full production"
    2. Link the ACTION/EVENT phrase, NOT the leading company/entity name
       - BAD: "[Google DeepMind](/...) announced robots"
       - GOOD: "Google DeepMind [announced Atlas robots](/...)"
    3. ONE link per distinct story/development in the text
    4. Link to the HIGHEST-RANKED item that covers that story (items are ordered by importance)
    5. Do NOT add new **bold** markers inside link labels. Preserve existing bold markers outside links.
    6. Preserve ALL original formatting exactly unless a link would require moving existing bold markers outside the link.
    7. For bullet points, link the key action/event after the entity prefix
    8. NEVER use generic glue text or section labels as a link. In particular,
       anchors such as "and the", "the most", "the best", "research and",
       "Source", or a bare category/entity name are invalid.
    9. Every link label must contain at least two meaningful content words and
       must not begin or end with an article, conjunction, or preposition.

    LINK FORMAT (exact format required):
    [descriptive phrase](/?date=${date}&category=CATEGORY#item-ITEMID)

    CRITICAL: The hash MUST start with "item-" followed by the item's id. Example:
      - Item with id "abc123def456" and category "news" becomes: /?date=${date}&category=news#item-abc123def456

    DATE: ${date}

    AVAILABLE ITEMS (ordered by importance - use id and category exactly as shown):
    ${items_json}

    TEXT TO ENRICH:
    ${text}

    OUTPUT (Use XML tags):
    <enriched_text>
    Full text with links using format /?date=${date}&category=CATEGORY#item-actualItemId
    </enriched_text>
    
    <links>
      <link phrase="the linked phrase" item_id="actualItemId" category="news" />
    </links>

    Remember: The anchor MUST be #item-ID (with item- prefix). Link actions, not entities. Avoid bold markers inside links.

  # Available variables: ${report_date}, ${coverage_date}, ${existing_models}, ${news_items}
  ecosystem_enrichment: |
    You are an AI model release analyst. Review today's news items and identify any NEW model releases that should be added to our tracking database.

    Current date: ${report_date}
    Coverage date: ${coverage_date} (news is from this date)

    ## Models Already Tracked
    ${existing_models}

    ## Today's News Items
    ${news_items}

    ## Task
    Identify any NEW model releases announced in today's news that are NOT already in our tracked list.

    For each new release found, extract:
    1. provider: The company (openai, anthropic, google, x-ai, meta-llama, deepseek, mistralai)
    2. model_name: The model name (e.g., "GPT-5.3", "Claude-5", "Gemini-4")
    3. ga_date: The release/announcement date (YYYY-MM-DD format, use coverage date if "today")
    4. confidence: How confident you are this is a genuine new release (high/medium/low)
    5. source: Brief note about which news item mentions this

    Return JSON:
    ```json
    {
      "new_releases": [
        {
          "provider": "openai",
          "model_name": "GPT-5.3",
          "ga_date": "2026-01-14",
          "confidence": "high",
          "source": "OpenAI blog announcement"
        }
      ],
      "notes": "Any observations about model releases in today's news"
    }
    ```

    IMPORTANT:
    - Only include GENUINE new model releases (not updates, features, or news about existing models)
    - Do NOT include models already in our tracked list
    - Be conservative - only high/medium confidence releases should be added
    - If no new releases found, return empty array
