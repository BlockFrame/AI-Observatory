            "id": "item_id",
            "summary": "...",
            "importance_score": 85,
            "reasoning": "...",
            "themes": ["theme1", "theme2"]
          }
        ],
        "category_themes": [
          {
            "name": "Theme Name",
            "description": "...",
            "item_count": 5,
            "importance": 80
          }
        ],
        "cross_signals": ["signal1", "signal2"]
      }
      ```

      Focus on:
      - Papers from major labs (Google, OpenAI, Anthropic, Meta, DeepMind)
      - Novel architectures or training methods
      - State-of-the-art results on important benchmarks
      - Papers addressing safety, alignment, or interpretability
      - Significant efficiency improvements
      - Substantive research blog posts with original technical content

    # Available variables: ${analysis_summary}
    ranking: |
      Rank the top 10 most significant research items (papers and blog posts).

      Analysis results:
      ${analysis_summary}

      Prioritize:
      1. Groundbreaking research with potential industry impact
      ```json
      {
        "top_10": ["id1", "id2", ...],
        "category_summary": "Structured summary using markdown formatting (see rules below)",
        "category_summary_evidence": [["id for bullet 1"], ["id 1 for bullet 2", "id 2 for bullet 2"]]
      }
      ```

      CATEGORY SUMMARY FORMATTING RULES:
      - Use exactly these headings: `### Executive Signal`, `### Priority Developments`, `### Leadership Implications`.
      - Under Executive Signal, write one decision-relevant synthesis bullet of at most 45 words.
      - Under Priority Developments, write 3-5 bullets of at most 40 words each; group related items and explain their practical or strategic implication.
      - Under Leadership Implications, write 1-2 action-oriented bullets of at most 35 words each.
      - Every section body must use bullets; never write prose paragraphs.
      - Keep the complete summary below 350 words and use **bold** selectively.
      - Do not include Markdown links; links are added later.
      - Return `category_summary_evidence` with one ordered array per summary bullet. Each array must contain 1-3 exact current item IDs supporting that bullet.
      - Use a rigorous, decision-oriented strategy-analysis style without naming any consulting firm or persona.

